# atlas-app static serving. Rationale: docs/performance/boot-payload-audit.md.
#
# Two cache classes. They must stay paired:
#
#   /assets/*   Vite content-hashed output. A new build emits a new filename,
#               so an old name can be cached forever and never revalidated.
#   index.html  Names those hashed files. It must revalidate on every load, or
#               a cached document outlives the chunks it points at and the app
#               boots against 404s.
#
# The same policy on Vercel lives in code/vercel.json. JSON takes no comments;
# if you change a value here, change it there too. That includes the
# frame-ancestors rule below; Vercel's /embed value is a fixed `*`.
#
# This file is an nginx template: the image's entrypoint writes the
# EMBED_FRAME_ANCESTORS environment variable into the map below (Dockerfile
# sets its default and NGINX_ENVSUBST_FILTER, so no nginx variable changes).

# A share token is a read capability, and it travels in the path
# (/m/<token>, /embed/<token>, /api/share/<token>/blob) and in the Referer of
# what those pages fetch. The access log writes [redacted] in its place.
# (The error log can still show a request line, e.g. when storage is down.)
map $request_uri $atlas_logged_uri {
  "~^(/(?:api/share|m|embed)/)[^/?#]+(.*)$" "$1[redacted]$2";
  default $request_uri;
}
map $http_referer $atlas_logged_referer {
  "~^(.*?/(?:m|embed)/)[^/?#]+(.*)$" "$1[redacted]$2";
  default $http_referer;
}
log_format atlas_redacted '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $atlas_logged_uri $server_protocol" '
                          '$status $body_bytes_sent "$atlas_logged_referer" '
                          '"$http_user_agent"';

# Who may frame a page. The content security policy itself is a <meta> in
# index.html (src/lib/contentSecurityPolicy.ts), and a <meta> cannot set
# frame-ancestors. /embed/<token> may be framed by EMBED_FRAME_ANCESTORS
# (docs/architecture/adr/0012-embed-frame-ancestors.md); every other page,
# which may hold write keys, only by this origin. $request_uri is the path
# the client asked for, before the SPA fallback rewrites it.
map $request_uri $atlas_frame_ancestors {
  "~^/embed/" "${EMBED_FRAME_ANCESTORS}";
  default "'self'";
}

server {
  listen 3000;
  access_log /var/log/nginx/access.log atlas_redacted;
  root /usr/share/nginx/html;
  index index.html;

  # Serve the .gz siblings the build emits (precompressPlugin in
  # vite.config.ts) instead of compressing per request. A file with no sibling
  # is served as-is — which is what keeps .pmtiles range-requestable, since the
  # plugin never compresses binary archives.
  gzip_static on;

  # SPA fallback: serve index.html for any path that isn't a real file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Content-hashed build output. `=404` rather than the SPA fallback above: a
  # missing chunk must fail as a 404, not return HTML under a .js URL.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # try_files' internal redirect re-enters location matching, so this covers
  # every SPA deep link and `/`, not only a literal request for /index.html.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors $atlas_frame_ancestors" always;
  }

  # Storage API on the same origin, for the minimal stack (no Caddy). The
  # browser then never makes a cross-origin call, so storage needs no CORS.
  # The variable plus Docker's resolver defers the lookup to request time, so
  # this image still starts where no `storage` host exists (behind Caddy,
  # which routes /api itself, this block is never reached).
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $storage http://storage:4000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $storage;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # LIMITS.upload (code/packages/protocol/src/limits.ts).
    client_max_body_size 50m;
  }

  location /data/ {
    add_header Cache-Control "public, max-age=2592000";
  }

  # The offline basemaps' label glyphs and sprites (public/basemap/). They
  # change only when scripts/vendor-basemap-assets.sh moves its pin.
  location /basemap/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000";
  }
}
