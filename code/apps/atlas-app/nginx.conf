# atlas-app static serving. Rationale: docs/performance/boot-payload-audit.md.
#
# Two cache classes. They must stay paired:
#
#   /assets/*   Vite content-hashed output. A new build emits a new filename,
#               so an old name can be cached forever and never revalidated.
#   index.html  Names those hashed files. It must revalidate on every load, or
#               a cached document outlives the chunks it points at and the app
#               boots against 404s.
#
# The same policy on Vercel lives in code/vercel.json. JSON takes no comments;
# if you change a value here, change it there too.

server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # Serve the .gz siblings the build emits (precompressPlugin in
  # vite.config.ts) instead of compressing per request. A file with no sibling
  # is served as-is — which is what keeps .pmtiles range-requestable, since the
  # plugin never compresses binary archives.
  gzip_static on;

  # SPA fallback: serve index.html for any path that isn't a real file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Content-hashed build output. `=404` rather than the SPA fallback above: a
  # missing chunk must fail as a 404, not return HTML under a .js URL.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # try_files' internal redirect re-enters location matching, so this covers
  # every SPA deep link and `/`, not only a literal request for /index.html.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Storage API on the same origin, for the minimal stack (no Caddy). The
  # browser then never makes a cross-origin call, so storage needs no CORS.
  # The variable plus Docker's resolver defers the lookup to request time, so
  # this image still starts where no `storage` host exists (behind Caddy,
  # which routes /api itself, this block is never reached).
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $storage http://storage:4000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $storage;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 50m;
  }

  location /data/ {
    add_header Cache-Control "public, max-age=2592000";
  }
}
