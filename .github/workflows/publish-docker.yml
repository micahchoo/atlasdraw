name: Publish Docker

# The published image is the self-host web image (code/apps/atlas-app/
# Dockerfile): Yarn 4, nginx with the SPA fallback and the cache classes, run
# as a non-root user. It is the local-only build: maps stay in the browser,
# and a deep link (/m/<token>, /m#..., /embed/...) serves the app.
# The build stage runs on the runner's own platform; only the nginx stage is
# per-platform, so the arm64 image needs no emulated Node build.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: code/apps/atlas-app/Dockerfile
          build-args: |
            VITE_BUILD_TARGET=local-only
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/micahchoo/atlasdraw:latest
            ghcr.io/micahchoo/atlasdraw:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
