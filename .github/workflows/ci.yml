name: CI

# One workflow is the gate for everything that reaches main. Pages deploys
# only after this workflow succeeds on main (see pages.yml).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      # Must precede setup-node: its yarn cache step shells out to yarn, and
      # classic yarn rejects the packageManager: yarn@4 pin without corepack.
      - run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: code/yarn.lock
      - run: yarn install --immutable
      - run: bash scripts/check-license.sh
      - run: bash scripts/check-telemetry.sh
      - run: yarn test:typecheck
      - run: yarn test:code
      - run: yarn test:other
      - run: yarn test:falsifiable
      - run: yarn test:app --watch=false

  storage-postgres:
    name: Storage adapter and migrations against real Postgres and S3
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: atlasdraw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # The Postgres and S3 tests in apps/storage run only when these are set.
      ATLASDRAW_TEST_PG_URL: postgres://postgres:test@localhost:5432/atlasdraw_test
      ATLASDRAW_TEST_S3_URL: http://testkey:testsecret@localhost:8333
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: code/yarn.lock
      - run: yarn install --immutable
      # An S3-compatible server, as an operator's own bucket would be
      # (docs/architecture/adr/0019-bring-your-own-s3.md). SeaweedFS needs an
      # identity file, which a `services:` container cannot mount, so it
      # starts here.
      # Every test bucket takes 7 volumes. SeaweedFS sizes its volume count by
      # free disk, which a runner has little of, so the limits are set here.
      - name: Start SeaweedFS S3
        run: |
          mkdir -p "$RUNNER_TEMP/s3"
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"testkey","secretKey":"testsecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3/s3.json"
          docker run -d --name s3 -p 8333:8333 -v "$RUNNER_TEMP/s3/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:3.97 server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0 \
            -master.volumeSizeLimitMB=4 -volume.max=5000
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8333 && exit 0; sleep 1; done
          docker logs s3; exit 1
      - run: yarn vitest run apps/storage
      - name: SeaweedFS log
        if: failure()
        run: docker logs s3 2>&1 | tail -200

  bench:
    name: Bench, merge base vs head (report only)
    runs-on: ubuntu-latest
    # Times the merge base and the head in this one job, on this one runner,
    # and writes the table to the job summary (code/bench/README.md).
    # REPORT ONLY: no --blocking. Add --blocking to the last step only after
    # 5 consecutive CI runs on unchanged parse code all pass; until then a
    # slower result is information, not a failed build.
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: code/yarn.lock
      - run: yarn install --immutable
      - name: Check out and install the merge base
        id: base
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE=$(git merge-base "$PR_BASE_SHA" HEAD)
          else
            BASE="$PUSH_BEFORE"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with ($BASE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base/code" && yarn install --immutable --mode=skip-build)
          echo "dir=$RUNNER_TEMP/base/code" >> "$GITHUB_OUTPUT"
      - if: steps.base.outputs.dir != ''
        run: yarn workspace @atlasdraw/bench ab --base "${{ steps.base.outputs.dir }}" --runs 5

  e2e:
    name: Browser tests on the dev server (chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: code/yarn.lock
      - run: yarn install --immutable
      - run: yarn workspace @atlasdraw/atlas-app exec playwright install --with-deps chromium
      - run: yarn workspace @atlasdraw/atlas-app exec playwright test --project=chromium
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: code/apps/atlas-app/test-results

  e2e-build:
    name: Browser tests on the production build (${{ matrix.target }})
    runs-on: ubuntu-latest
    # What ships: playwright.build.config.ts builds the target, serves it as
    # it is deployed (Pages: /atlasdraw/ with the 404.html fallback; hosted:
    # vite preview with the storage server at /api) and drives it through
    # the UI: boot, draw, save and reload, share and embed links, fonts, and
    # no CSP violation, console error or unnamed host on any of them.
    strategy:
      fail-fast: false
      matrix:
        target: [hosted, pages]
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: code/yarn.lock
      - run: yarn install --immutable
      - run: yarn workspace @atlasdraw/atlas-app exec playwright install --with-deps chromium
      - run: yarn workspace @atlasdraw/atlas-app exec playwright test --config=playwright.build.config.ts
        env:
          CI: "true"
          E2E_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-build-${{ matrix.target }}
          path: code/apps/atlas-app/test-results

  boot-size:
    name: Boot size per route (budget)
    runs-on: ubuntu-latest
    # Gzip size of what each route loads before it paints: the page entry
    # plus the route root and their static imports (src/lib/bootPayload.ts).
    # Fails over the budgets in scripts/check-boot-size.ts.
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: code/yarn.lock
      - run: yarn install --immutable
      - run: yarn workspace @atlasdraw/atlas-app exec vite build --manifest
      - run: node --experimental-strip-types scripts/check-boot-size.ts
        working-directory: code/apps/atlas-app

  self-host:
    name: Self-host images build and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Minimal stack (web + storage) serves and saves a map
        run: infra/smoke-minimal.sh
      - name: Realtime image builds and answers /health
        run: |
          docker build -f code/apps/realtime/Dockerfile -t atlasdraw-realtime .
          docker run -d --name realtime -p 4001:4001 atlasdraw-realtime
          for i in $(seq 1 30); do curl -fsS localhost:4001/health && exit 0; sleep 1; done
          docker logs realtime; exit 1
