name: GitHub Pages deploy

# Deploys only a commit that passed CI. A push to main runs CI first; this
# workflow starts when CI finishes, and skips the deploy unless CI succeeded.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Must precede setup-node: its `cache: yarn` step shells out to yarn to
      # locate the cache folder, and classic yarn 1.22 errors on the
      # `packageManager: yarn@4` pin unless corepack has already shimmed yarn.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "yarn"
          cache-dependency-path: code/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: code

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build atlas-app (pages target)
        run: yarn workspace @atlasdraw/atlas-app build
        env:
          VITE_BUILD_TARGET: pages
          VITE_PMTILES_PATH: /atlasdraw/data/world-low-zoom.pmtiles
        working-directory: code

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: code/apps/atlas-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
