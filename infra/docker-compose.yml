# Atlasdraw — full production-recommended self-host stack.
#
# Services: web (atlas-app) + storage (Fastify, postgres-minio mode)
# + postgres + minio (+ minio-init, a one-shot setup job) + caddy (TLS and
# reverse proxy). All traffic between services stays on the compose network;
# only Caddy exposes 80/443.
#
# Run from the repository root. Compose does NOT read a `.env` in the root by
# itself (it looks next to this file), so pass it:
#   cp infra/.env.example .env
#   # edit .env — set PUBLIC_DOMAIN, ACME_EMAIL, POSTGRES_PASSWORD,
#   # MINIO_ROOT_PASSWORD and MINIO_APP_PASSWORD
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
#
# What you get:
#   - https://${PUBLIC_DOMAIN}/        → atlas-app (web)
#   - https://${PUBLIC_DOMAIN}/api/*   → storage HTTP API (Caddy strips /api)
#   - Postgres on the internal network, never exposed externally.
#   - MinIO on the internal network. The storage server uses its own MinIO
#     user (MINIO_APP_USER), limited to the maps bucket; the root user is
#     only for minio-init and for you.
#
# Collaboration: the `realtime` service runs with the "realtime" profile:
#   docker compose --profile realtime --env-file .env -f infra/docker-compose.yml up -d

services:
  storage:
    build:
      context: ..
      dockerfile: code/apps/storage/Dockerfile
    environment:
      STORAGE_MODE: postgres-minio
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:-atlasdraw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atlasdraw}
      BLOB_ENDPOINT: http://minio:9000
      # The app's own MinIO user (minio-init makes it), not the root user.
      BLOB_ACCESS_KEY: ${MINIO_APP_USER:-atlasdraw-app}
      BLOB_SECRET_KEY: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD in .env}
      BLOB_BUCKET: ${BLOB_BUCKET:-atlasdraw-maps}
      BLOB_REGION: ${BLOB_REGION:-us-east-1}
      PUBLIC_URL: https://${PUBLIC_DOMAIN}
      # One hop: Caddy. Lets the limiters see the real client address.
      TRUST_PROXY: "1"
      # Limits. Each default equals the server's default
      # (docs/self-host/production.md "Storage limits"). Never set one to an
      # empty value: an empty number reads as 0, which means "no limit".
      MAX_TOTAL_BYTES: ${MAX_TOTAL_BYTES:-10737418240}
      MAX_MAP_BYTES: ${MAX_MAP_BYTES:-52428800}
      MAX_NEW_MAPS_PER_IP: ${MAX_NEW_MAPS_PER_IP:-60}
      MAX_CONCURRENT_PER_IP: ${MAX_CONCURRENT_PER_IP:-16}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      SWEEP_INTERVAL_MS: ${SWEEP_INTERVAL_MS:-3600000}
      LEGACY_MAP_GRACE_DAYS: ${LEGACY_MAP_GRACE_DAYS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # A shutdown lets requests in flight finish (SHUTDOWN_TIMEOUT_MS, 25 s).
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: code/apps/atlas-app/Dockerfile
      args:
        VITE_BUILD_TARGET: hosted
        # Same origin — Caddy routes /api/* to storage. createHttpStorageClient
        # accepts an empty baseUrl as "same origin"; the leading slash here
        # tells it to prefix requests with /api before they hit Caddy.
        VITE_STORAGE_BASE_URL: /api
        VITE_PMTILES_PATH: /data/world-low-zoom.pmtiles
        # Collaboration — set VITE_REALTIME_ENABLED=true (and run the
        # "realtime" profile). An empty URL means same origin: Caddy routes /yjs.
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-false}
        VITE_REALTIME_WS_URL: ${VITE_REALTIME_WS_URL:-}
    depends_on:
      - storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlasdraw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atlasdraw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # MinIO's last community image, pinned by digest (RELEASE.2025-09-07).
  # MinIO no longer publishes community images: on 2026-10-01 neither
  # docker.io/minio/minio nor quay.io/minio/minio served it to an anonymous
  # pull. If yours cannot pull it, point BLOB_ENDPOINT at any S3 server you
  # run (docs/self-host/production.md "Blob storage").
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlasdraw}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  # One-shot setup, run on every `up`: the bucket, and an app user whose
  # policy reaches only that bucket. It uses the `mc` in the MinIO image.
  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlasdraw}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:-atlasdraw-app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD in .env}
      BLOB_BUCKET: ${BLOB_BUCKET:-atlasdraw-maps}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set root http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "root/$$BLOB_BUCKET"
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::%s"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$$BLOB_BUCKET" "$$BLOB_BUCKET" > /tmp/atlasdraw-app.json
        mc admin policy create root atlasdraw-app /tmp/atlasdraw-app.json
        mc admin user add root "$$MINIO_APP_USER" "$$MINIO_APP_PASSWORD"
        mc admin policy attach root atlasdraw-app --user "$$MINIO_APP_USER" || mc admin user info root "$$MINIO_APP_USER"
    restart: "no"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Which sites may frame /embed (CSP frame-ancestors). Default: any.
      EMBED_FRAME_ANCESTORS: ${EMBED_FRAME_ANCESTORS:-*}
    depends_on:
      - web
      - storage
    restart: unless-stopped

  # The realtime relay: one Y.Doc per room over y-websocket, saved to SQLite
  # (ADR-0014, ADR-0018). Compose profiles, Compose v2.2+.
  # Start with: docker compose --profile realtime -f infra/docker-compose.yml up -d
  realtime:
    build:
      context: ..
      dockerfile: code/apps/realtime/Dockerfile
    profiles: ["realtime"]
    # Not published to the host. The relay is reachable only on the compose
    # network, via Caddy's /yjs route, so room traffic is TLS-terminated at
    # the edge like every other route. `expose` documents the internal port;
    # add a `ports:` mapping back only for direct local debugging, never in
    # prod.
    expose:
      - "4001"
    environment:
      PORT: "4001"
      ROOMS_DB: /data/rooms.sqlite
      # Caddy is the one proxy in front: read the client address it saw.
      TRUST_PROXY: "1"
      # Empty means the relay's default (docs/self-host/production.md).
      MAX_ROOMS: ${MAX_ROOMS:-}
      MAX_ROOM_SIZE: ${MAX_ROOM_SIZE:-}
      MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-}
      MAX_ROOM_BYTES: ${MAX_ROOM_BYTES:-}
      MAX_TOTAL_ROOM_BYTES: ${MAX_TOTAL_ROOM_BYTES:-}
      MAX_NEW_ROOMS_PER_IP: ${MAX_NEW_ROOMS_PER_IP:-}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-}
      ROOM_EXPIRY_DAYS: ${ROOM_EXPIRY_DAYS:-}
      ROOM_SWEEP_INTERVAL_MS: ${ROOM_SWEEP_INTERVAL_MS:-}
    volumes:
      - roomsdata:/data
    restart: unless-stopped

volumes:
  roomsdata: # the relay's rooms (SQLite)
  pgdata:
  miniodata:
  caddy_data: # auto-renewed TLS certs persist across container restarts
  caddy_config:
