# Atlasdraw — minimal self-host stack.
# One machine on a network you trust (a laptop, a LAN, a VPN). SQLite +
# filesystem blobs. No postgres, no S3, no TLS: do not put it on the internet
# as it is; use docker-compose.yml and docs/self-host/production.md.
# Run: docker compose -f infra/docker-compose.minimal.yml up
#
# What you get:
#   - localhost:3000 — atlas-app (web). The storage API is on the same origin
#     at /api (nginx proxies it), so the browser never calls another origin.
#   - storage — internal only; not published to the host.
#   - One named volume for the storage server's data (sqlite db + blobs).
#
# Operator overrides from the shell, or from a `.env` NEXT TO THIS FILE
# (infra/.env) or one passed with --env-file:
#   PUBLIC_URL=https://atlas.example.com  (used in share-link URLs)
#   LOG_LEVEL=debug                       (storage server log level)
# The storage limits keep the server's defaults (docs/self-host/production.md
# "Storage limits"); add one to `environment` below to change it.

services:
  storage:
    build:
      context: ..
      dockerfile: code/apps/storage/Dockerfile
    environment:
      STORAGE_MODE: sqlite-fs
      DATA_DIR: /data
      PORT: "4000"
      PUBLIC_URL: ${PUBLIC_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The web container's nginx, on this private compose network. Storage
      # refuses a hop count (apps/storage/src/config.ts).
      TRUST_PROXY: "loopback,uniquelocal"
    volumes:
      - atlas-storage-data:/data
    expose:
      - "4000"
    # A shutdown lets requests in flight finish (SHUTDOWN_TIMEOUT_MS, 25 s).
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: code/apps/atlas-app/Dockerfile
      args:
        VITE_BUILD_TARGET: hosted
        VITE_STORAGE_BASE_URL: /api
        VITE_PMTILES_PATH: /data/world-low-zoom.pmtiles
    depends_on:
      storage:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  atlas-storage-data:
